<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixieLords Assets</title>
<style>
  :root{
    --bg:#05070d; --panel:#0c111c; --panel2:#121a2a; --line:#1f2a40;
    --ink:#dfe8ff; --dim:#8b97b3; --accent:#56e0ff; --gold:#e8c46a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,Segoe UI,Roboto,sans-serif}
  body{display:flex;flex-direction:column;min-height:100%}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:16px 20px 0}
  h1{margin:0;font-size:26px;letter-spacing:5px;color:var(--accent);text-shadow:0 0 16px rgba(86,224,255,.45)}
  .sub{color:var(--dim);font-size:12px;letter-spacing:2px}
  nav{display:flex;gap:6px;padding:14px 20px 0;border-bottom:1px solid var(--line);overflow-x:auto}
  nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
  nav button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
  nav button span{opacity:.6;font-size:12px}
  main{flex:1;min-height:0}
  section{display:none;height:100%}
  section.on{display:block}

  /* models */
  #models.on{display:grid;grid-template-columns:230px 1fr 260px;height:calc(100vh - 110px);min-height:420px}
  .list{border-right:1px solid var(--line);overflow-y:auto;padding:10px 0}
  .list h3{margin:12px 16px 6px;font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
  .list button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:7px 16px;font:inherit;font-size:14px;cursor:pointer}
  .list button:hover{background:var(--panel2)}
  .list button[aria-current=true]{background:var(--panel2);color:var(--accent);box-shadow:inset 3px 0 var(--accent)}
  .stage{position:relative;min-width:0;background:radial-gradient(ellipse at 50% 70%,#16213a 0,var(--bg) 70%)}
  .stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  .stage canvas:active{cursor:grabbing}
  .toolbar{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
  .toolbar label{display:flex;align-items:center;gap:6px;background:rgba(12,17,28,.85);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
  .status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);pointer-events:none;text-align:center;padding:20px}
  .info{border-left:1px solid var(--line);padding:16px;overflow-y:auto;font-size:14px}
  .info h2{margin:0 0 2px;font-size:20px}
  .info .role{color:var(--gold);font-size:13px}
  .info p{color:var(--dim);font-size:13px;margin:6px 0 14px}
  .info dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 16px;font-size:13px}
  .info dt{color:var(--dim)}
  .info dd{margin:0;font-variant-numeric:tabular-nums}
  .info h4{margin:14px 0 6px;font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
  .info a{color:var(--accent);text-decoration:none;display:inline-block;margin:0 10px 6px 0;font-size:13px}
  .info a:hover{text-decoration:underline}
  .info img{width:100%;border-radius:8px;border:1px solid var(--line);background:#000;cursor:zoom-in}

  /* galleries */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:18px 20px 40px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:zoom-in;display:flex;flex-direction:column}
  .card:hover{border-color:var(--accent)}
  .card img{width:100%;aspect-ratio:3/2;object-fit:cover;background:#000;display:block}
  .card.tall img{aspect-ratio:3/4;object-fit:contain}
  .card .cap{padding:10px 12px;font-size:13px;line-height:1.4}
  .card .cap b{display:block;font-size:14px;margin-bottom:2px}
  .card .cap small{color:var(--dim)}

  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:10;cursor:zoom-out;padding:16px}
  #lightbox.on{display:flex}
  #lightbox img{max-width:100%;max-height:100%;object-fit:contain}

  @media (max-width:860px){
    #models.on{grid-template-columns:1fr;grid-template-rows:auto 60vh auto;height:auto}
    .list{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;overflow-y:hidden;padding:6px}
    .list h3{display:none}
    .list button{width:auto;white-space:nowrap;border-radius:6px}
    .list button[aria-current=true]{box-shadow:inset 0 -2px var(--accent)}
    .info{border-left:0;border-top:1px solid var(--line)}
    header,nav{padding-left:16px;padding-right:16px}
    .grid{padding:14px 16px 32px;grid-template-columns:1fr}
  }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<header>
  <h1>PIXIELORDS</h1>
  <div class="sub">ASSET LIBRARY · FROM TOWERLORDS</div>
</header>
<nav role="tablist" id="tabs"></nav>
<main>
  <section id="models">
    <div class="list" id="modelList"></div>
    <div class="stage" id="stage">
      <canvas id="view"></canvas>
      <div class="status" id="status">Loading…</div>
      <div class="toolbar">
        <label><input type="checkbox" id="walk" checked> Walk</label>
        <label><input type="checkbox" id="spin" checked> Turntable</label>
      </div>
    </div>
    <aside class="info" id="info"></aside>
  </section>
  <section id="concept"><div class="grid" id="conceptGrid"></div></section>
  <section id="reference"><div class="grid" id="referenceGrid"></div></section>
  <section id="ui"><div class="grid" id="uiGrid"></div></section>
</main>
<div id="lightbox"><img alt=""></div>

<script type="module">
import * as THREE from 'three';
import { createModel, animateWalk } from './src/models3d.js';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const status = msg => { $('status').textContent = msg || ''; $('status').style.display = msg ? '' : 'none'; };

// ---------- lightbox
const lb = $('lightbox');
const openImage = (src, alt) => { lb.querySelector('img').src = src; lb.querySelector('img').alt = alt || ''; lb.classList.add('on'); };
lb.onclick = () => lb.classList.remove('on');
addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('on'); });

// ---------- tabs
function tabs(defs) {
  const nav = $('tabs');
  const show = key => {
    for (const d of defs) { $(d.key).classList.toggle('on', d.key === key); nav.querySelector(`[data-k=${d.key}]`).setAttribute('aria-selected', d.key === key); }
    try { localStorage.setItem('pl-tab', key); } catch {}
    if (key === 'models') resize();
  };
  nav.innerHTML = defs.map(d => `<button role="tab" data-k="${d.key}">${esc(d.label)} <span>${d.count}</span></button>`).join('');
  nav.onclick = e => { const b = e.target.closest('button'); if (b) show(b.dataset.k); };
  let start = 'models'; try { start = localStorage.getItem('pl-tab') || start; } catch {}
  show(defs.some(d => d.key === start) ? start : 'models');
}

// ---------- galleries
function gallery(el, items, tall) {
  el.innerHTML = items.map((it, i) => `
    <div class="card${tall ? ' tall' : ''}" data-i="${i}">
      <img loading="lazy" src="${esc(it.file)}" alt="${esc(it.title)}">
      <div class="cap"><b>${esc(it.title)}</b>${it.description ? `<small>${esc(it.description)}</small>` : ''}</div>
    </div>`).join('');
  el.onclick = e => { const c = e.target.closest('.card'); if (c) { const it = items[+c.dataset.i]; openImage(it.file, it.title); } };
}

// ---------- 3D viewer
const canvas = $('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, .05, 100);
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x2a2018, 1.1));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.2);
sun.position.set(2.5, 4, 3); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2 });
scene.add(sun);
const rim = new THREE.DirectionalLight(0x56e0ff, .8); rim.position.set(-3, 2, -3); scene.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(1.6, 48), new THREE.MeshStandardMaterial({ color: 0x141c2c, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const pivot = new THREE.Group(); scene.add(pivot);

let current = null, yaw = .5, pitch = .12, dist = 3.4, token = 0;
function frame(model) {
  const box = new THREE.Box3().setFromObject(model.userData.mesh);
  const h = Math.max(box.max.y, .5);
  camera.userData.target = new THREE.Vector3(0, h * .5, 0);
  dist = h * 2.4 + .8;
}
function place() {
  const t = camera.userData.target || new THREE.Vector3(0, .5, 0);
  camera.position.set(t.x + Math.sin(yaw) * Math.cos(pitch) * dist, t.y + Math.sin(pitch) * dist, t.z + Math.cos(yaw) * Math.cos(pitch) * dist);
  camera.lookAt(t);
}
function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  if (!r.width || !r.height) return;
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement);

let drag = null;
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); $('spin').checked = false; });
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  yaw -= (e.clientX - drag.x) * .01; pitch = Math.max(-.2, Math.min(1.2, pitch + (e.clientY - drag.y) * .006));
  drag = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointerup', () => drag = null);
canvas.addEventListener('wheel', e => { e.preventDefault(); dist = Math.max(1, Math.min(10, dist * (1 + Math.sign(e.deltaY) * .1))); }, { passive: false });

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta(), t = clock.elapsedTime;
  if ($('spin').checked) yaw += dt * .5;
  if (current) animateWalk(current, t, $('walk').checked ? 1 : 0);
  place();
  if ($('models').classList.contains('on')) renderer.render(scene, camera);
});

async function showModel(m, button) {
  const my = ++token;
  for (const b of $('modelList').querySelectorAll('button')) b.setAttribute('aria-current', b === button);
  try { localStorage.setItem('pl-model', m.id); } catch {}
  status('Loading ' + m.name + '…');
  renderInfo(m);
  try {
    const model = await createModel(m.id);
    if (my !== token) return;
    if (current) pivot.remove(current);
    current = model; pivot.add(model); frame(model);
    status('');
  } catch (err) {
    if (my !== token) return;
    console.error(err);
    status(location.protocol === 'file:'
      ? 'Models load over HTTP. Run "python3 -m http.server" in the repo and open http://localhost:8000'
      : 'Could not load ' + m.id + ': ' + err.message);
  }
}

function renderInfo(m) {
  const f = m.files, swing = [m.rig.arms && 'arms', m.rig.legs && 'legs'].filter(Boolean).join(' + ') || 'body bob only';
  $('info').innerHTML = `
    <h2>${esc(m.name)}</h2>
    <div class="role">${esc(m.familyName)}${m.class ? ' · ' + esc(m.class) : ''}</div>
    <p>${m.traits.map(esc).join(' · ')}</p>
    <dl>
      <dt>id</dt><dd>${esc(m.id)}</dd>
      <dt>triangles</dt><dd>${m.triangles.toLocaleString()}</dd>
      <dt>vertices</dt><dd>${m.vertices.toLocaleString()}</dd>
      <dt>size</dt><dd>×${m.size}</dd>
      <dt>swing</dt><dd>${esc(swing)}</dd>
    </dl>
    <h4>Files</h4>
    <a href="${esc(f.asset)}" download>asset.json</a><a href="${esc(f.obj)}" download>OBJ</a><a href="${esc(f.mtl)}" download>MTL</a><a href="${esc(f.atlas)}" download>atlas</a>
    <h4>Texture atlas</h4>
    <img loading="lazy" src="${esc(f.atlas)}" alt="${esc(m.name)} texture atlas" data-zoom>
    <h4>Rig weights</h4>
    <img loading="lazy" src="${esc(f.rig)}" alt="${esc(m.name)} rig weights" data-zoom>
    ${m.reference ? `<h4>Concept</h4><img loading="lazy" src="${esc(m.reference)}" alt="${esc(m.name)} concept" data-zoom>` : ''}`;
}
$('info').onclick = e => { const img = e.target.closest('[data-zoom]'); if (img) openImage(img.src, img.alt); };

// ---------- boot
const manifest = await fetch('assets/manifest.json').then(r => r.json()).catch(() => null);
if (!manifest) {
  status('Open this page over HTTP: run "python3 -m http.server" in the repo, then visit http://localhost:8000');
  tabs([{ key: 'models', label: 'Models', count: '' }]);
} else {
  const fam = manifest.families;
  const list = $('modelList');
  for (const [key, f] of Object.entries(fam)) {
    list.insertAdjacentHTML('beforeend', `<h3>${esc(f.name)}</h3>`);
    for (const m of manifest.models.filter(m => m.family === key)) {
      m.familyName = f.name;
      const b = document.createElement('button'); b.textContent = m.name; b.onclick = () => showModel(m, b);
      list.appendChild(b); m.button = b;
    }
  }
  gallery($('conceptGrid'), manifest.concept);
  gallery($('referenceGrid'), manifest.reference, true);
  gallery($('uiGrid'), manifest.ui);
  tabs([
    { key: 'models', label: 'Models', count: manifest.models.length },
    { key: 'concept', label: 'Concept art', count: manifest.concept.length },
    { key: 'reference', label: 'Character sheets', count: manifest.reference.length },
    { key: 'ui', label: 'UI', count: manifest.ui.length },
  ]);
  let startId = manifest.models[0].id; try { startId = localStorage.getItem('pl-model') || startId; } catch {}
  const start = manifest.models.find(m => m.id === startId) || manifest.models[0];
  showModel(start, start.button);
}
</script>
</body>
</html>
