<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixieLords</title>
<meta name="description" content="A fast, stance-based action game in the browser: a fae knight, a keep of goblins and ratmen, and a warlord upon the throne.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#e9e4d6; --dim:#9a927f; --gold:#e6c36a; --red:#b3212b; --blood:#7a0f18; --ki:#bfe8c8; --anima:#b98cff; --cyan:#8ff0ff;
    --panel:rgba(8,8,12,.82); --line:rgba(230,195,106,.28);
    --serif:'Cinzel',Georgia,'Times New Roman',serif; --sans:system-ui,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#05060a;color:var(--ink);font-family:var(--sans)}
  canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}

  /* ---------------- HUD */
  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .6s}
  #hud.on{opacity:1}
  .stats{position:absolute;left:28px;top:26px;display:flex;flex-direction:column;gap:5px}
  .bar{position:relative;height:11px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);box-shadow:0 0 0 1px rgba(0,0,0,.6);transition:width .4s}
  .bar i{position:absolute;inset:1px;transform-origin:left;display:block}
  .bar.hp .fill{background:linear-gradient(#d23a44,#8c1420)}
  .bar.hp .trail{background:#f0c37a;opacity:.75}
  .bar.ki{height:8px}
  .bar.ki .fill{background:linear-gradient(#e8fff0,#7fc79a)}
  .bar.ki .pool{background:var(--cyan);opacity:0;transition:opacity .1s}
  .bar.ki.pulse .pool{opacity:.9;box-shadow:0 0 10px var(--cyan)}
  .bar.ki.low .fill{background:linear-gradient(#ffd0a0,#c46a3a);animation:blink .5s infinite alternate}
  .bar.anima{height:6px;width:12vw}
  .bar.anima .fill{background:linear-gradient(90deg,#6a3fd8,#d38cff)}
  .bar.anima.full{box-shadow:0 0 12px var(--anima);border-color:var(--anima)}
  .bar.anima.shift .fill{background:linear-gradient(90deg,#ff5ad0,#8ff0ff)}
  .bar.anima .ready{position:absolute;left:calc(100% + 10px);top:-5px;font:600 11px var(--serif);letter-spacing:2px;color:var(--anima);white-space:nowrap;opacity:0}
  .bar.anima.full .ready{opacity:1;animation:blink .8s infinite alternate}
  .stance{display:flex;align-items:center;gap:6px;font:600 12px var(--serif);letter-spacing:2px;margin-top:2px}
  .stance span{opacity:.3;font-size:12px;transition:opacity .15s,transform .15s}
  .stance span.on{opacity:1;transform:scale(1.35)}
  .stance[data-s=high]{color:#ffb060}.stance[data-s=mid]{color:var(--cyan)}.stance[data-s=low]{color:#9dff9a}
  .stance b{margin-left:4px;font-weight:600;text-transform:uppercase}
  .stance small{margin-left:6px;color:var(--dim);font:10px var(--sans);letter-spacing:0}
  .weapon{font:600 11px var(--serif);letter-spacing:2px;text-transform:uppercase;color:#cfd8e8;margin-top:1px}
  .weapon[data-w=glaive]{color:#c9b4ff} .weapon[data-w=fangs]{color:#ffb4c8} .weapon[data-w=hammer]{color:#ffcf8a} .weapon[data-w=fists]{color:#9fe8ff}
  .weapon small{margin-left:6px;color:var(--dim);font:10px var(--sans);letter-spacing:0;text-transform:none}
  .status{font:12px var(--sans);color:#a6e070;display:flex;gap:10px;align-items:center;min-height:14px}
  .status .snared{color:#e0c080} .status .burning{color:#ff9a50} .status .frozen{color:#bfe6ff;text-shadow:0 0 8px #6fc8ff}
  .pbuild{width:80px;height:4px;background:rgba(0,0,0,.6);position:relative;display:none}
  .pbuild i{position:absolute;inset:0;background:#8fe040;transform-origin:left}
  .pbuild.cbuild i{background:#9fdcff}
  @keyframes blink{from{opacity:.55}to{opacity:1}}

  .elixir{position:absolute;left:30px;bottom:30px;display:flex;align-items:flex-end;gap:10px}
  .artslot{position:absolute;left:130px;bottom:32px;display:flex;align-items:center;gap:8px;text-shadow:0 2px 6px #000}
  .artslot i{font-style:normal;font-size:22px}
  .artslot b{display:block;font:600 14px var(--serif);letter-spacing:.05em}
  .artslot small{font:11px var(--sans);color:var(--dim)}
  .artslot.empty{opacity:.45}
  .rangedslot{position:absolute;left:130px;bottom:72px;display:flex;align-items:center;gap:8px;text-shadow:0 2px 6px #000}
  .rangedslot i{font-style:normal;font-size:20px}
  .rangedslot b{display:block;font:600 14px var(--serif);letter-spacing:.05em}
  .rangedslot small{font:11px var(--sans);color:var(--dim)}
  .rangedslot.empty{opacity:.45}
  .rangedslot s{display:block;width:120px;height:4px;margin-top:4px;background:rgba(255,255,255,.12);text-decoration:none}
  .rangedslot s[hidden]{display:none}
  .rangedslot s u{display:block;height:100%;width:0;background:#cff6ff;text-decoration:none}.rangedslot s.hot u{background:#ff8a6a}
  .reticle{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
  .reticle i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#e8f4ff;box-shadow:0 0 6px #9ff3ff}
  .reticle b{position:absolute;left:0;top:0;width:26px;height:26px;border:1.5px solid rgba(232,244,255,.75);border-radius:50%;transform:translate(-50%,-50%)}
  .reticle.wait i{background:#ff9a7a}.reticle.wait b{border-color:rgba(255,154,122,.5)}.reticle.lock b{border-color:var(--gold)}
  .flask{width:30px;height:40px;position:relative}
  .flask:before{content:'';position:absolute;left:10px;top:0;width:10px;height:10px;border:2px solid #d9c8b0;border-bottom:0;border-radius:2px 2px 0 0}
  .flask i{position:absolute;left:1px;right:1px;bottom:0;height:30px;border:2px solid #d9c8b0;border-radius:40% 40% 45% 45%;background:radial-gradient(circle at 50% 70%,#ff8ac4,#a1225e 70%);box-shadow:0 0 14px rgba(255,90,170,.5)}
  .elixir.empty .flask i{background:#222;box-shadow:none}
  .elixir b{font:700 26px var(--serif);text-shadow:0 2px 6px #000}
  .elixir .key{font:11px var(--sans);color:var(--dim);margin-bottom:6px}
  .glimmer{position:absolute;right:30px;bottom:28px;text-align:right}
  .combo{position:absolute;right:34px;top:38%;text-align:right;opacity:0;transition:opacity .4s;pointer-events:none}
  .combo.on{opacity:1}
  .combo b{display:block;font:600 34px var(--serif);color:#e8f2ff;text-shadow:0 0 12px rgba(127,240,255,.5);line-height:1}
  .combo small{font:600 11px var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
  .combo[data-tier="1"] b{color:#bff4ff}.combo[data-tier="2"] b{color:#ffe7a0}.combo[data-tier="3"] b{color:#ffb070}.combo[data-tier="4"] b{color:#ff8ad8}
  .combo.bump b{animation:cbump .18s ease-out}
  @keyframes cbump{0%{transform:scale(1.35)}100%{transform:scale(1)}}
  .glimmer small{display:block;font:600 10px var(--serif);letter-spacing:3px;color:var(--dim)}
  .glimmer b{font:700 26px var(--serif);color:var(--gold);text-shadow:0 0 12px rgba(230,195,106,.4),0 2px 6px #000}
  .glimmer .gain{display:block;font:600 16px var(--serif);color:#ffe6a0;opacity:0;text-shadow:0 0 8px rgba(255,210,122,.6)}

  .lock{position:absolute;left:0;top:0;width:0;height:0}
  .lock:before{content:'';position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:radial-gradient(#fff 0 28%,rgba(255,255,255,.2) 32% 60%,transparent 64%);box-shadow:0 0 10px #fff}

  .ebars{position:absolute;inset:0}
  .ebar{position:absolute;left:0;top:0;width:0;height:0}
  .ebar > div{position:absolute;left:-45px;width:90px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.15)}
  .ebar .eh{top:-10px;height:6px}
  .ebar .ek{top:-3px;height:3px;border-top:0}
  .ebar i{position:absolute;inset:0;transform-origin:left;display:block}
  .ebar .eh .fill{background:#c42a36}.ebar .eh .trail{background:#f0c37a;opacity:.7}
  .ebar .ek .fill{background:#f1f1e6}
  .ebar.broken .ek .fill{background:#ffd24a;animation:blink .25s infinite alternate}
  .ebar .dmg{position:absolute;left:50px;top:-15px;font:600 13px var(--serif);color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap}
  .emark{position:absolute;left:0;top:0;font:700 26px var(--serif);text-shadow:0 0 10px rgba(0,0,0,.95),0 2px 3px #000;animation:pop .25s ease-out}
  .emark.alarm{color:#ff7a50;text-shadow:0 0 12px rgba(255,90,40,.7),0 2px 3px #000}
  .emark.sus{color:#ffd878;font-size:22px}
  @keyframes pop{from{font-size:8px}}
  .ftext{position:absolute;left:0;top:-40px;transform:translateX(-50%);font:700 15px var(--serif);letter-spacing:2px;white-space:nowrap;animation:rise 1.4s forwards}
  .ftext.broken{color:#ffd24a;text-shadow:0 0 10px rgba(255,200,60,.8),0 2px 4px #000}
  @keyframes rise{from{opacity:1;transform:translate(-50%,6px)}to{opacity:0;transform:translate(-50%,-26px)}}

  .boss{position:absolute;left:50%;bottom:7vh;width:min(64vw,900px);transform:translateX(-50%)}
  .bname{font:600 16px var(--serif);letter-spacing:2px;margin:0 0 5px 2px;text-shadow:0 2px 6px #000}
  .bbar{position:relative;height:10px;background:rgba(0,0,0,.65);border:1px solid rgba(230,195,106,.45)}
  .bbar i,.bki i{position:absolute;inset:1px;transform-origin:left;display:block}
  .bbar .fill{background:linear-gradient(#c23038,#6e0f16)}
  .bbar .trail{background:#f0c37a;opacity:.7}
  .bki{position:relative;height:4px;margin-top:3px;background:rgba(0,0,0,.6)}
  .bki .fill{background:#ecebe0}
  .brow.broken .bki .fill{background:#ffd24a;animation:blink .25s infinite alternate}
  .brow.armored .bbar{border-color:#bfe6ff;box-shadow:0 0 10px rgba(143,210,255,.55)}
  .brow.armored .bname:after{content:' · rime armour';font:italic 13px var(--serif);color:#bfe6ff;letter-spacing:.04em}
  .brow.fallen{opacity:.3;transition:opacity 1s}
  .boss .brow + .brow{margin-top:12px}
  .boss.duo .bname{font-size:14px}

  .prompt{position:absolute;left:50%;bottom:19vh;transform:translateX(-50%);background:rgba(8,8,12,.78);border:1px solid var(--line);padding:9px 18px;font:15px var(--serif);letter-spacing:1px;white-space:nowrap}
  kbd{display:inline-block;min-width:22px;padding:1px 6px;margin-right:6px;border:1px solid var(--gold);border-radius:4px;color:var(--gold);font:600 12px var(--sans);text-align:center}
  .toasts{position:absolute;left:50%;top:62%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
  .toast{font:600 15px var(--serif);letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 8px rgba(0,0,0,.9),0 2px 4px #000;transition:opacity .6s,transform .6s;white-space:nowrap}
  .toast.out{opacity:0;transform:translateY(-10px)}
  .toast.pulse{color:var(--cyan)} .toast.burst{color:#ffd0f4;font-size:20px;text-shadow:0 0 14px #ff5ad0,0 2px 4px #000}
  .toast.flash{color:#fff;font-size:24px;letter-spacing:6px;text-shadow:0 0 18px #fff,0 0 30px #8ff0ff,0 2px 4px #000}
  .toast.crit{color:#ffd080;font-size:19px} .toast.warn{color:#ff8a70} .toast.anima{color:var(--anima)} .toast.poison{color:#a6e070} .toast.frost{color:#bfe6ff;text-shadow:0 0 10px #4fa8ff,0 2px 4px #000} .toast.item{color:var(--gold);text-transform:none;letter-spacing:1px}

  .banner{position:absolute;left:0;right:0;top:24%;text-align:center;opacity:0}
  .banner span{display:inline-block;font:400 clamp(24px,3.4vw,44px) var(--serif);letter-spacing:.2em;padding:8px 40px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-shadow:0 2px 10px #000}
  .banner.on{animation:banner 4.2s ease forwards}
  @keyframes banner{0%{opacity:0;letter-spacing:.35em}15%{opacity:1}75%{opacity:1}100%{opacity:0;letter-spacing:.2em}}

  .big{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;opacity:0;transition:opacity 1.2s;padding:3.2vh 0}
  .big.on{opacity:1}
  .big.died,.big.gold{background:linear-gradient(transparent,rgba(0,0,0,.78) 25%,rgba(0,0,0,.78) 75%,transparent)}
  .big span{font:400 clamp(40px,7vw,96px) var(--serif);letter-spacing:.12em}
  .big em{display:block;font:italic 16px var(--serif);color:#cfc8b6;margin-top:6px;letter-spacing:.06em}
  .big.died span{color:#a8141c;text-shadow:0 0 30px rgba(168,20,28,.5)}
  .big.gold span{color:var(--gold);text-shadow:0 0 30px rgba(230,195,106,.5)}
  .big.on.died span,.big.on.gold span{animation:grow 5s ease-out forwards}
  .big.intro span{font:italic 400 clamp(18px,2.2vw,28px)/1.7 var(--serif);letter-spacing:.06em;white-space:pre-line;color:#e9e4d6;text-shadow:0 2px 12px #000}
  .big.intro{background:linear-gradient(transparent,rgba(0,0,0,.55) 30%,rgba(0,0,0,.55) 70%,transparent);top:38%}
  .big.shrine span{font-size:clamp(26px,3.6vw,48px);color:var(--cyan);text-shadow:0 0 20px rgba(143,240,255,.6)}
  @keyframes grow{from{letter-spacing:.08em}to{letter-spacing:.2em}}

  .flash{position:absolute;inset:0;opacity:0}
  .flash.hurt{background:radial-gradient(ellipse at center,transparent 45%,rgba(160,0,10,.55));animation:fl .6s ease-out}
  .flash.burst{background:radial-gradient(ellipse at center,rgba(255,255,255,.45),rgba(255,120,230,.2) 60%,transparent);animation:fl .35s ease-out}
  .flash.flashcut{background:#fff;animation:fl .45s ease-out}
  .flash.moon{background:radial-gradient(ellipse at center,rgba(120,150,255,.05),rgba(60,80,200,.35));animation:fl 1.2s ease-in}
  .flash.shift{background:radial-gradient(ellipse at center,rgba(255,120,230,.4),rgba(140,240,255,.25));animation:fl .8s ease-out}
  @keyframes fl{from{opacity:1}to{opacity:0}}
  .edge{position:absolute;inset:0;opacity:0;box-shadow:inset 0 0 120px rgba(255,20,20,.7)}
  .edge.on{animation:fl .8s ease-out}
  .msg{position:absolute;left:50%;bottom:16vh;transform:translateX(-50%);width:min(620px,90vw);background:var(--panel);border:1px solid var(--line);padding:20px 26px;text-align:center}
  .msg p{margin:0 0 10px;font:17px/1.6 var(--serif);white-space:pre-line}
  .msg small{color:var(--dim)}
  .msg h3,.msg em{display:none}
  .msg.letter{width:min(560px,92vw);bottom:10vh;background:linear-gradient(170deg,#d9c9a4,#c2ad84);border:0;box-shadow:0 12px 40px rgba(0,0,0,.6),inset 0 0 40px rgba(90,60,20,.35);color:#2a1e10;text-align:left;padding:24px 30px 18px}
  .msg.letter h3{display:block;margin:0 0 10px;font:600 20px var(--serif);letter-spacing:.06em;color:#4a2a10}
  .msg.letter p{font:italic 16px/1.65 Georgia,var(--serif);color:#2a1e10;max-height:46vh;overflow-y:auto}
  .msg.letter em{display:block;font:italic 12px var(--sans);color:#6a4a20;margin-bottom:6px}
  .msg.letter small{color:#5a4a30}
  .journal .entry{border-bottom:1px solid rgba(255,255,255,.06);padding:10px 2px}
  .journal .entry b{font:600 17px var(--serif);display:block}
  .journal .entry small{color:var(--dim);font-size:12px}
  .journal .btn.lt{font-size:15px;padding:6px 14px;font-style:italic}
  .journal .btn.lt[disabled]{opacity:.3}
  .journal .map{max-height:56vh;overflow-y:auto;padding-right:6px}
  .journal .map:before{display:none}
  .parchment{background:linear-gradient(170deg,#d9c9a4,#c2ad84);color:#2a1e10;padding:22px 28px;margin:6px 0 12px;box-shadow:inset 0 0 40px rgba(90,60,20,.35)}
  .parchment p{font:italic 16px/1.7 Georgia,var(--serif);white-space:pre-line;margin:0}
  .fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .8s}
  .loadingMsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000;font:italic 20px var(--serif);color:var(--dim);letter-spacing:.1em}
  .loadingMsg.on{display:flex}
  .loadingMsg span{animation:blink 1s infinite alternate}
  .fade.on{opacity:1}

  /* ---------------- menus */
  #menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(5,6,10,.55),rgba(5,6,10,.92));z-index:5;padding:16px}
  #menu.on{display:flex}
  #menu.journal,#menu.letter,#menu.moves,#menu.arsenal{background:rgba(5,6,10,.88)}
  .arsenal .map{max-height:58vh;overflow-y:auto;padding-right:6px;display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .arsenal .arm{display:flex;gap:12px;align-items:center;border:1px solid rgba(255,255,255,.08);padding:10px 12px;background:rgba(255,255,255,.02)}
  .arsenal .arm.hand{border-color:var(--gold)}.arsenal .arm.back{border-color:rgba(230,195,106,.35)}
  .arsenal .ainfo{flex:1;display:flex;flex-direction:column;gap:3px}.arsenal .ainfo b{font:600 17px var(--serif)}
  .arsenal .ainfo small{font-size:12px;line-height:1.4}.arsenal .rank{color:#ffcf8a}.arsenal .mech{color:var(--gold);font:600 12px var(--sans)}
  .moves .btn.tab{font-size:13px;padding:5px 10px}
  .arsenal .ainfo .mtag{align-self:flex-start;font:600 10px var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--dim)}.arsenal .ainfo .mtag.cleared{color:var(--gold)}
  .arsenal .rhead{margin-top:8px}
  .arsenal .abtns{display:flex;flex-direction:column;gap:6px;min-width:190px}
  .btn.small{font-size:14px;padding:6px 12px;width:100%}.btn.small small{display:block;font-size:11px;color:var(--dim)}
  @media (max-width:700px){.arsenal .arm{flex-direction:column;align-items:stretch}}
  .moves .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
  .moves .btn.tab{width:auto;padding:6px 14px;font-size:14px;opacity:.6}.moves .btn.tab.on{opacity:1;border-color:var(--gold)}
  .moves .forms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .moves .form{border:1px solid rgba(255,255,255,.08);padding:10px 12px;background:rgba(255,255,255,.02)}
  .moves .fh{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}.moves .fh b{font:600 16px var(--serif)}.moves .fh small{color:var(--dim);font-size:11px;margin-left:auto}
  .moves .form.high .fh i{color:#ffb060}.moves .form.mid .fh i{color:var(--cyan)}.moves .form.low .fh i{color:#9dff9a}
  .moves p{margin:4px 0;font-size:13px;line-height:1.45}.moves p em{display:block;font:600 10px var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-style:normal}
  .moves .kit{margin-top:10px}
  #menu.skills{background:rgba(5,6,10,.88)}
  .skills .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
  .skills .btn.tab{width:auto;padding:6px 14px;font-size:14px;opacity:.6}.skills .btn.tab.on{opacity:1;border-color:var(--gold)}
  .skills .pts{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;background:var(--gold);color:#1a1408;font:700 11px var(--sans);border-radius:9px}
  .skills .mastery{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--dim);margin-bottom:10px}
  .skills .mastery i{flex:1;height:6px;background:rgba(255,255,255,.08);position:relative}.skills .mastery i b{position:absolute;left:0;top:0;bottom:0;background:var(--cyan)}
  .skills .tree{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding-right:6px}
  .skills .srow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
  .skills .btn.skill{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:10px 12px;min-height:92px}
  .skills .btn.skill b{font:600 15px var(--serif)}.skills .btn.skill small{font-size:12px;line-height:1.4;opacity:.85}.skills .btn.skill small b{font:600 12px var(--sans);color:var(--gold)}
  .skills .btn.skill .stag{margin-top:auto;font:600 10px var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
  .skills .btn.skill.has{border-color:var(--gold);opacity:1}.skills .btn.skill.has .stag{color:var(--gold)}
  .skills .btn.skill.can{border-color:var(--cyan)}.skills .btn.skill.can .stag{color:var(--cyan)}
  .skills .btn.skill.no{opacity:.55}
  @media (max-width:700px){.moves .forms{grid-template-columns:1fr}}
