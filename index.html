<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixieLords</title>
<meta name="description" content="A soulslike in the browser: a fae knight, a keep of goblins and ratmen, and a lord upon the throne.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#e9e4d6; --dim:#9a927f; --gold:#e6c36a; --red:#b3212b; --blood:#7a0f18; --ki:#bfe8c8; --anima:#b98cff; --cyan:#8ff0ff;
    --panel:rgba(8,8,12,.82); --line:rgba(230,195,106,.28);
    --serif:'Cinzel',Georgia,'Times New Roman',serif; --sans:system-ui,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#05060a;color:var(--ink);font-family:var(--sans)}
  canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}

  /* ---------------- HUD */
  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .6s}
  #hud.on{opacity:1}
  .stats{position:absolute;left:28px;top:26px;display:flex;flex-direction:column;gap:5px}
  .bar{position:relative;height:11px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);box-shadow:0 0 0 1px rgba(0,0,0,.6);transition:width .4s}
  .bar i{position:absolute;inset:1px;transform-origin:left;display:block}
  .bar.hp .fill{background:linear-gradient(#d23a44,#8c1420)}
  .bar.hp .trail{background:#f0c37a;opacity:.75}
  .bar.ki{height:8px}
  .bar.ki .fill{background:linear-gradient(#e8fff0,#7fc79a)}
  .bar.ki .pool{background:var(--cyan);opacity:0;transition:opacity .1s}
  .bar.ki.pulse .pool{opacity:.9;box-shadow:0 0 10px var(--cyan)}
  .bar.ki.low .fill{background:linear-gradient(#ffd0a0,#c46a3a);animation:blink .5s infinite alternate}
  .bar.anima{height:6px;width:12vw}
  .bar.anima .fill{background:linear-gradient(90deg,#6a3fd8,#d38cff)}
  .bar.anima.full{box-shadow:0 0 12px var(--anima);border-color:var(--anima)}
  .bar.anima.shift .fill{background:linear-gradient(90deg,#ff5ad0,#8ff0ff)}
  .bar.anima .ready{position:absolute;left:calc(100% + 10px);top:-5px;font:600 11px var(--serif);letter-spacing:2px;color:var(--anima);white-space:nowrap;opacity:0}
  .bar.anima.full .ready{opacity:1;animation:blink .8s infinite alternate}
  .status{font:12px var(--sans);color:#a6e070;display:flex;gap:10px;align-items:center;min-height:14px}
  .pbuild{width:80px;height:4px;background:rgba(0,0,0,.6);position:relative;display:none}
  .pbuild i{position:absolute;inset:0;background:#8fe040;transform-origin:left}
  @keyframes blink{from{opacity:.55}to{opacity:1}}

  .elixir{position:absolute;left:30px;bottom:30px;display:flex;align-items:flex-end;gap:10px}
  .flask{width:30px;height:40px;position:relative}
  .flask:before{content:'';position:absolute;left:10px;top:0;width:10px;height:10px;border:2px solid #d9c8b0;border-bottom:0;border-radius:2px 2px 0 0}
  .flask i{position:absolute;left:1px;right:1px;bottom:0;height:30px;border:2px solid #d9c8b0;border-radius:40% 40% 45% 45%;background:radial-gradient(circle at 50% 70%,#ff8ac4,#a1225e 70%);box-shadow:0 0 14px rgba(255,90,170,.5)}
  .elixir.empty .flask i{background:#222;box-shadow:none}
  .elixir b{font:700 26px var(--serif);text-shadow:0 2px 6px #000}
  .elixir .key{font:11px var(--sans);color:var(--dim);margin-bottom:6px}
  .amrita{position:absolute;right:30px;bottom:28px;text-align:right}
  .amrita small{display:block;font:600 10px var(--serif);letter-spacing:3px;color:var(--dim)}
  .amrita b{font:700 26px var(--serif);color:var(--gold);text-shadow:0 0 12px rgba(230,195,106,.4),0 2px 6px #000}
  .amrita .gain{display:block;font:600 16px var(--serif);color:#ffe6a0;opacity:0;text-shadow:0 0 8px rgba(255,210,122,.6)}

  .lock{position:absolute;left:0;top:0;width:0;height:0}
  .lock:before{content:'';position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:radial-gradient(#fff 0 28%,rgba(255,255,255,.2) 32% 60%,transparent 64%);box-shadow:0 0 10px #fff}

  .ebars{position:absolute;inset:0}
  .ebar{position:absolute;left:0;top:0;width:0;height:0}
  .ebar > div{position:absolute;left:-45px;width:90px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.15)}
  .ebar .eh{top:-10px;height:6px}
  .ebar .ek{top:-3px;height:3px;border-top:0}
  .ebar i{position:absolute;inset:0;transform-origin:left;display:block}
  .ebar .eh .fill{background:#c42a36}.ebar .eh .trail{background:#f0c37a;opacity:.7}
  .ebar .ek .fill{background:#f1f1e6}
  .ebar.broken .ek .fill{background:#ffd24a;animation:blink .25s infinite alternate}
  .ebar .dmg{position:absolute;left:50px;top:-15px;font:600 13px var(--serif);color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap}
  .ftext{position:absolute;left:0;top:-40px;transform:translateX(-50%);font:700 15px var(--serif);letter-spacing:2px;white-space:nowrap;animation:rise 1.4s forwards}
  .ftext.broken{color:#ffd24a;text-shadow:0 0 10px rgba(255,200,60,.8),0 2px 4px #000}
  @keyframes rise{from{opacity:1;transform:translate(-50%,6px)}to{opacity:0;transform:translate(-50%,-26px)}}

  .boss{position:absolute;left:50%;bottom:7vh;width:min(64vw,900px);transform:translateX(-50%)}
  .bname{font:600 16px var(--serif);letter-spacing:2px;margin:0 0 5px 2px;text-shadow:0 2px 6px #000}
  .bbar{position:relative;height:10px;background:rgba(0,0,0,.65);border:1px solid rgba(230,195,106,.45)}
  .bbar i,.bki i{position:absolute;inset:1px;transform-origin:left;display:block}
  .bbar .fill{background:linear-gradient(#c23038,#6e0f16)}
  .bbar .trail{background:#f0c37a;opacity:.7}
  .bki{position:relative;height:4px;margin-top:3px;background:rgba(0,0,0,.6)}
  .bki .fill{background:#ecebe0}
  .boss.broken .bki .fill{background:#ffd24a;animation:blink .25s infinite alternate}

  .prompt{position:absolute;left:50%;bottom:19vh;transform:translateX(-50%);background:rgba(8,8,12,.78);border:1px solid var(--line);padding:9px 18px;font:15px var(--serif);letter-spacing:1px;white-space:nowrap}
  kbd{display:inline-block;min-width:22px;padding:1px 6px;margin-right:6px;border:1px solid var(--gold);border-radius:4px;color:var(--gold);font:600 12px var(--sans);text-align:center}
  .toasts{position:absolute;left:50%;top:62%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
  .toast{font:600 15px var(--serif);letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 8px rgba(0,0,0,.9),0 2px 4px #000;transition:opacity .6s,transform .6s;white-space:nowrap}
  .toast.out{opacity:0;transform:translateY(-10px)}
  .toast.pulse{color:var(--cyan)} .toast.burst{color:#ffd0f4;font-size:20px;text-shadow:0 0 14px #ff5ad0,0 2px 4px #000}
  .toast.crit{color:#ffd080;font-size:19px} .toast.warn{color:#ff8a70} .toast.anima{color:var(--anima)} .toast.poison{color:#a6e070} .toast.item{color:var(--gold);text-transform:none;letter-spacing:1px}

  .banner{position:absolute;left:0;right:0;top:24%;text-align:center;opacity:0}
  .banner span{display:inline-block;font:400 clamp(24px,3.4vw,44px) var(--serif);letter-spacing:.2em;padding:8px 40px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-shadow:0 2px 10px #000}
  .banner.on{animation:banner 4.2s ease forwards}
  @keyframes banner{0%{opacity:0;letter-spacing:.35em}15%{opacity:1}75%{opacity:1}100%{opacity:0;letter-spacing:.2em}}

  .big{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;opacity:0;transition:opacity 1.2s;padding:3.2vh 0}
  .big.on{opacity:1}
  .big.died,.big.gold{background:linear-gradient(transparent,rgba(0,0,0,.78) 25%,rgba(0,0,0,.78) 75%,transparent)}
  .big span{font:400 clamp(40px,7vw,96px) var(--serif);letter-spacing:.12em}
  .big.died span{color:#a8141c;text-shadow:0 0 30px rgba(168,20,28,.5)}
  .big.gold span{color:var(--gold);text-shadow:0 0 30px rgba(230,195,106,.5)}
  .big.on.died span,.big.on.gold span{animation:grow 5s ease-out forwards}
  .big.intro span{font:italic 400 clamp(18px,2.2vw,28px)/1.7 var(--serif);letter-spacing:.06em;white-space:pre-line;color:#e9e4d6;text-shadow:0 2px 12px #000}
  .big.intro{background:linear-gradient(transparent,rgba(0,0,0,.55) 30%,rgba(0,0,0,.55) 70%,transparent);top:38%}
  .big.shrine span{font-size:clamp(26px,3.6vw,48px);color:var(--cyan);text-shadow:0 0 20px rgba(143,240,255,.6)}
  @keyframes grow{from{letter-spacing:.08em}to{letter-spacing:.2em}}

  .flash{position:absolute;inset:0;opacity:0}
  .flash.hurt{background:radial-gradient(ellipse at center,transparent 45%,rgba(160,0,10,.55));animation:fl .6s ease-out}
  .flash.burst{background:radial-gradient(ellipse at center,rgba(255,255,255,.45),rgba(255,120,230,.2) 60%,transparent);animation:fl .35s ease-out}
  .flash.shift{background:radial-gradient(ellipse at center,rgba(255,120,230,.4),rgba(140,240,255,.25));animation:fl .8s ease-out}
  @keyframes fl{from{opacity:1}to{opacity:0}}
  .edge{position:absolute;inset:0;opacity:0;box-shadow:inset 0 0 120px rgba(255,20,20,.7)}
  .edge.on{animation:fl .8s ease-out}
  .msg{position:absolute;left:50%;bottom:16vh;transform:translateX(-50%);width:min(620px,90vw);background:var(--panel);border:1px solid var(--line);padding:20px 26px;text-align:center}
  .msg p{margin:0 0 10px;font:17px/1.6 var(--serif);white-space:pre-line}
  .msg small{color:var(--dim)}
  .fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .8s}
  .fade.on{opacity:1}

  /* ---------------- menus */
  #menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(5,6,10,.55),rgba(5,6,10,.92));z-index:5;padding:16px}
  #menu.on{display:flex}
  #menu.title{background:linear-gradient(90deg,rgba(5,6,10,.88) 0,rgba(5,6,10,.55) 45%,rgba(5,6,10,0) 75%);justify-content:flex-start;padding-left:7vw}
  #menu.shrine{background:linear-gradient(90deg,rgba(5,6,10,.9) 0,rgba(5,6,10,.6) 50%,rgba(5,6,10,0) 80%);justify-content:flex-start;padding-left:6vw}
  .panel{width:min(460px,100%);max-height:100%;overflow-y:auto}
  .panel.wide{width:min(760px,100%)}
  .panel.title{width:min(720px,100%)}
  .panel h1{font:700 clamp(40px,6vw,76px) var(--serif);letter-spacing:.14em;margin:0;color:var(--ink);text-shadow:0 0 30px rgba(143,240,255,.25),0 4px 18px #000}
  .panel h2{font:600 28px var(--serif);letter-spacing:.14em;margin:0 0 16px;color:var(--gold)}
  .tag{font:italic 16px var(--serif);color:var(--dim);margin:6px 0 34px}
  .btns{display:flex;flex-direction:column;gap:2px;margin:18px 0}
  .btn{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;color:var(--ink);font:20px var(--serif);letter-spacing:.06em;padding:10px 16px;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,padding .15s}
  .btn small{display:block;font:12px var(--sans);color:var(--dim);letter-spacing:0;margin-top:2px}
  .btn.focus,.btn:hover{background:linear-gradient(90deg,rgba(230,195,106,.18),transparent);border-left-color:var(--gold);padding-left:22px}
  .btn[disabled]{opacity:.35;cursor:default}
  .foot,.dim{font-size:12px;color:var(--dim)}
  .loading{position:relative;height:3px;background:rgba(255,255,255,.1);margin:0 0 8px;width:80%}
  .loading i{position:absolute;inset:0;background:var(--gold);transform-origin:left;transition:transform .3s}
  .loading span{position:absolute;top:8px;left:0;font-size:12px;color:var(--dim);white-space:nowrap}
  .ctl{width:100%;border-collapse:collapse;font-size:14px}
  .ctl th{text-align:left;color:var(--dim);font-weight:400;padding:4px 8px;border-bottom:1px solid var(--line)}
  .ctl td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.06)}
  .ctl td:first-child{font-family:var(--serif)}
  .tips p{font-size:13px;line-height:1.55;color:#cfc8b6;margin:10px 0}
  .tips b{color:var(--gold)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.06);font:16px var(--serif)}
  .row input[type=range]{width:180px;accent-color:var(--gold)}
  .row input.focus{outline:1px solid var(--gold);outline-offset:4px}
  .row input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold)}
  .lv{display:flex;gap:26px;margin:4px 0 14px}
  .lv small{display:block;font:600 10px var(--serif);letter-spacing:2px;color:var(--dim)}
  .lv b{font:700 24px var(--serif)} .lv .gold{color:var(--gold)}
  .derived{font-size:12px;color:var(--dim);margin-bottom:10px}
  .stat{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .stat b{font:600 17px var(--serif)} .stat .val{font:700 17px var(--serif);color:var(--gold);margin-left:8px}
  .stat small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
  .btn.plus{width:44px;text-align:center;padding:6px 0;font-size:22px;border:1px solid var(--line);border-left:1px solid var(--line)}
  .btn.plus.focus,.btn.plus:hover{padding-left:0;background:rgba(230,195,106,.2);border-color:var(--gold)}
  .ending{text-align:center;width:min(640px,100%)}
  .ending h1{font-size:clamp(30px,4.4vw,52px)}
  .ending p{font:17px/1.7 var(--serif);color:#d6cfbd}
  .ending .lv{justify-content:center}
  .ending .btn{text-align:center}
  .error{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#300;border:1px solid #a33;padding:10px 16px;font-size:14px;max-width:90vw}
  @media (max-width:700px){
    .stats{left:16px;top:16px}.elixir{left:16px;bottom:16px}.amrita{right:16px;bottom:16px}
    #menu.title,#menu.shrine{padding-left:16px;background:rgba(5,6,10,.8)}
  }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="hud"></div>
<div id="menu"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
